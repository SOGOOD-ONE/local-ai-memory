<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Local AI Cost Optimizer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f1f3f6;
      color: #17181a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .popup-container {
      width: 100%;
      max-width: 360px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      border: 1px solid #e5e7eb;
    }
    main {
      padding: 20px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #f0f2f5;
    }
    .brand {
      font-size: 15px;
      font-weight: 700;
      color: #111827;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .brand::before {
      content: "";
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
    }
    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 999px;
      transition: all 0.2s;
    }
    .badge.online {
      background: #ecfdf5;
      color: #059669;
      border: 1px solid #a7f3d0;
    }
    .badge.offline {
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
    }
    .platform {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f8fafc;
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 14px;
      font-size: 13px;
      border: 1px solid #e2e8f0;
    }
    .platform span {
      color: #64748b;
    }
    .platform strong {
      color: #0f172a;
      font-weight: 600;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }
    .stats > div {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 10px 8px;
      text-align: center;
    }
    .stats span {
      display: block;
      font-size: 10px;
      color: #64748b;
      margin-bottom: 4px;
      white-space: nowrap;
    }
    .stats strong {
      display: block;
      font-size: 14px;
      color: #0f172a;
      font-weight: 700;
    }
    .decision {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 16px;
    }
    .decision .label {
      font-size: 11px;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .decision #decision {
      font-size: 14px;
      font-weight: 600;
      color: #0f172a;
      margin-bottom: 4px;
    }
    .decision p {
      font-size: 12px;
      line-height: 1.5;
      color: #64748b;
      margin: 0;
    }
    button#check {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 11px 14px;
      background: #111827;
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
    }
    button#check:hover {
      background: #1f2937;
    }
    button#check:active {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="popup-container">
    <main>
      <header>
        <div class="brand">Local AI Cost Optimizer</div>
        <div id="serverBadge" class="badge offline">检查中</div>
      </header>

      <section class="platform">
        <span>当前平台</span>
        <strong id="platform">检测中…</strong>
      </section>

      <section class="stats">
        <div><span>节省输入 token</span><strong id="savedInput">0</strong></div>
        <div><span>输出预算累计</span><strong id="savedOutput">0</strong></div>
        <div><span>输入节省比例</span><strong id="savedCost">0.00%</strong></div>
      </section>

      <section class="decision">
        <div class="label">优化决策</div>
        <div id="decision">等待请求</div>
        <p id="reason">插件连接本地成本优化服务后，这里会显示累计优化效果。</p>
      </section>

      <button id="check">检查本地服务</button>
    </main>
  </div>

  <script>
    const status = document.getElementById("serverBadge");
    const check = document.getElementById("check");
    const platform = document.getElementById("platform");
    const savedInput = document.getElementById("savedInput");
    const savedOutput = document.getElementById("savedOutput");
    const savedCost = document.getElementById("savedCost");
    const decision = document.getElementById("decision");
    const reason = document.getElementById("reason");

    function formatNumber(value) {
      return Number(value || 0).toLocaleString("zh-CN");
    }

    async function loadStats() {
      try {
        const response = await fetch("/api/stats");
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        savedInput.textContent = formatNumber(data.saved_input_tokens);
        savedOutput.textContent = formatNumber(data.output_token_budget);
        savedCost.textContent = `${Number(data.input_saving_ratio || 0).toFixed(2)}%`;
        if (data.requests) {
          decision.textContent = `已处理 ${formatNumber(data.requests)} 次请求`;
          reason.textContent = `实际应用 ${formatNumber(data.applied_requests)} 次，输入 token 节省 ${Number(data.input_saving_ratio || 0).toFixed(2)}%。`;
        }
      } catch {
        decision.textContent = "等待统计数据";
        reason.textContent = "本地服务在线后，这里会显示累计优化效果。";
      }
    }

    async function checkServer() {
      status.textContent = "检查中";
      status.className = "badge";
      try {
        const response = await fetch("/api/health");
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        status.textContent = data.status === "ok" ? "本地服务在线" : "服务异常";
        status.className = `badge ${data.status === "ok" ? "online" : "offline"}`;
        if (data.status === "ok") await loadStats();
      } catch {
        status.textContent = "本地服务离线";
        status.className = "badge offline";
      }
    }

    function loadTab() {
      platform.textContent = "ChatGPT / 豆包 / Trea";
    }

    check.addEventListener("click", checkServer);
    loadTab();
    checkServer();
  </script>
</body>
</html>
